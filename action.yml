name: 'Moon Release'
description: 'Automated release management for MoonBit projects'
author: 'dijdzv'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  command:
    description: 'Command to run: check, update, release-pr, or release'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: true
  mooncakes-token:
    description: 'mooncakes.io token for publishing (from ~/.moon/credentials.json)'
    required: false
  mooncakes-username:
    description: 'mooncakes.io username'
    required: false
  config-file:
    description: 'Path to configuration file'
    required: false
    default: 'release.json'
  bump:
    description: 'Force bump type: major, minor, or patch'
    required: false
    default: ''
  bump-all:
    description: 'Bump all packages including unchanged ones (monorepo)'
    required: false
    default: 'false'
  dry-run:
    description: 'Show what would be done without making changes'
    required: false
    default: 'false'
  verbose:
    description: 'Enable verbose output'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The new version number'
    value: ${{ steps.release.outputs.version }}
  tag:
    description: 'The created tag name'
    value: ${{ steps.release.outputs.tag }}
  pr-url:
    description: 'The URL of the created pull request (for release-pr command)'
    value: ${{ steps.release.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup MoonBit (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> $GITHUB_PATH
    - name: Setup MoonBit (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
        irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
        "$env:USERPROFILE\.moon\bin" | Out-File -Append $env:GITHUB_PATH

    - name: Setup mooncakes.io credentials
      if: inputs.mooncakes-token != '' && inputs.mooncakes-username != ''
      shell: bash
      env:
        MOONCAKES_TOKEN: ${{ inputs.mooncakes-token }}
        MOONCAKES_USERNAME: ${{ inputs.mooncakes-username }}
      run: |
        mkdir -p ~/.moon
        jq -n --arg token "$MOONCAKES_TOKEN" --arg username "$MOONCAKES_USERNAME" \
          '{"token": $token, "username": $username}' > ~/.moon/credentials.json
        chmod 600 ~/.moon/credentials.json

    - name: Build moon-release
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"
        moon update
        moon build --target native --release

    - name: Run moon-release
      id: release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CONFIG: ${{ inputs.config-file }}
        INPUT_BUMP: ${{ inputs.bump }}
        INPUT_BUMP_ALL: ${{ inputs.bump-all }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        BUMP_FLAG=""
        BUMP_ALL_FLAG=""
        DRY_RUN_FLAG=""
        VERBOSE_FLAG=""
        if [ -n "$INPUT_BUMP" ]; then
          BUMP_FLAG="--bump $INPUT_BUMP"
        fi
        if [ "$INPUT_BUMP_ALL" = "true" ]; then
          BUMP_ALL_FLAG="--bump-all"
        fi
        if [ "$INPUT_DRY_RUN" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
        fi
        if [ "$INPUT_VERBOSE" = "true" ]; then
          VERBOSE_FLAG="--verbose"
        fi

        set +e
        OUTPUT=$("$ACTION_PATH/_build/native/release/build/moon-release.exe" \
          "$INPUT_COMMAND" \
          --config "$INPUT_CONFIG" \
          $BUMP_FLAG \
          $BUMP_ALL_FLAG \
          $DRY_RUN_FLAG \
          $VERBOSE_FLAG 2>&1)
        EXIT_CODE=$?
        set -e
        echo "$OUTPUT"
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::moon-release failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi

        # Capture outputs for downstream steps
        VERSION=$(echo "$OUTPUT" | grep -oP '(?:^|[ ])v?\K[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+_-]*' | tail -1 || true)
        TAG=$(echo "$OUTPUT" | grep -oP '(?:tag:\s*)\K\S+' | tail -1 || true)
        PR_URL=$(echo "$OUTPUT" | grep -oP 'https://github\.com/[^\s"]+/pull/[0-9]+' | tail -1 || true)

        {
          echo "version=${VERSION:-}"
          echo "tag=${TAG:-}"
          echo "pr-url=${PR_URL:-}"
        } >> "$GITHUB_OUTPUT"
