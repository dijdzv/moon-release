# Moon Release Workflow Template
# Copy this file to .github/workflows/ in your MoonBit project
#
# Required repository settings:
# 1. Settings → Actions → General → Workflow permissions
#    - Select "Read and write permissions"
#    - Check "Allow GitHub Actions to create and approve pull requests"
#
# Optional (for mooncakes.io publishing):
# 2. Settings → Secrets and variables → Actions
#    - MOONCAKES_TOKEN: from ~/.moon/credentials.json
#    - MOONCAKES_USERNAME: from ~/.moon/credentials.json

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual changes)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  MOON_RELEASE_VERSION: latest  # or specific version like "v0.1.0"

jobs:
  # Create or update release PR on every push to main
  release-pr:
    runs-on: ubuntu-latest
    if: "!(startsWith(github.event.head_commit.message, 'chore:') && contains(github.event.head_commit.message, 'release v'))"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Download moon-release
        run: |
          if [ "${{ env.MOON_RELEASE_VERSION }}" = "latest" ]; then
            curl -fsSL -o moon-release https://github.com/dijdzv/moon-release/releases/latest/download/moon-release-linux-x86_64
          else
            curl -fsSL -o moon-release https://github.com/dijdzv/moon-release/releases/download/${{ env.MOON_RELEASE_VERSION }}/moon-release-linux-x86_64
          fi
          chmod +x moon-release

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          ./moon-release release-pr $DRY_RUN_FLAG --verbose

  # Create release when release PR is merged
  # Triggered by commit message starting with "chore:" and containing "release v"
  # Note: contains() does partial matching, so "release v" could match unintended
  # commits. The startsWith('chore:') check narrows the scope significantly.
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore:') && contains(github.event.head_commit.message, 'release v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      # Configure mooncakes credentials (only if publishing to mooncakes.io)
      # Remove this step if "publish": false in release.json
      - name: Configure mooncakes credentials
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
          MOONCAKES_USERNAME: ${{ secrets.MOONCAKES_USERNAME }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "No mooncakes token configured, skipping credentials setup"
            exit 0
          fi
          mkdir -p ~/.moon
          jq -n --arg token "$MOONCAKES_TOKEN" --arg username "$MOONCAKES_USERNAME" \
            '{"token": $token, "username": $username}' > ~/.moon/credentials.json
          chmod 600 ~/.moon/credentials.json

      - name: Download moon-release
        run: |
          if [ "${{ env.MOON_RELEASE_VERSION }}" = "latest" ]; then
            curl -fsSL -o moon-release https://github.com/dijdzv/moon-release/releases/latest/download/moon-release-linux-x86_64
          else
            curl -fsSL -o moon-release https://github.com/dijdzv/moon-release/releases/download/${{ env.MOON_RELEASE_VERSION }}/moon-release-linux-x86_64
          fi
          chmod +x moon-release

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./moon-release release --verbose
