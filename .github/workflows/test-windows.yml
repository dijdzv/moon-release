name: Test Windows Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-windows.yml'
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup MoonBit
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@7315a94840631165970262a99c72cfb48a65d25d # v1.13.0

      - name: Fetch dependencies
        run: moon update

      - name: Build (with prebuild script for linker flags)
        env:
          CC: cl
        run: moon build --target native --release

      - name: Test binary
        run: |
          .\_build\native\release\build\src\main\main.exe --help
          .\_build\native\release\build\src\main\main.exe check --dry-run 2>&1 || true
