name: Test Windows Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-windows.yml'
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Fetch dependencies
        run: moon update

      - name: Build (with prebuild script for linker flags)
        run: moon build --target native

      - name: Test binary
        run: |
          .\_build\native\release\build\src\main\main.exe --help
          .\_build\native\release\build\src\main\main.exe check --dry-run 2>&1 || true
