name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup MoonBit
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Setup MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -Append $env:GITHUB_PATH
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@7315a94840631165970262a99c72cfb48a65d25d
      - name: Fetch dependencies
        run: moon update
      - name: Check
        if: runner.os == 'Linux'
        run: moon check --target native
      - name: Test
        if: runner.os == 'Linux'
        run: moon test --target native
      - name: Build release executable
        run: moon build --target native --release
      - name: Verify unpublished release detection
        if: runner.os == 'Linux'
        run: moon run scripts/test_release_pending.mbtx -- "${{ runner.temp }}/release-state-${{ github.run_id }}-${{ github.run_attempt }}"
