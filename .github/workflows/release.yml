name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual changes)'
        type: boolean
        default: false
      build-only:
        description: 'Build binaries only (skip release-pr)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Build moon-release
        run: |
          moon update
          moon build --target native

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run moon-release (release-pr)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          ./target/native/release/build/src/main/main.exe release-pr $DRY_RUN_FLAG --verbose

  # Build binaries for multiple platforms
  # Triggered when a release PR is merged (commit message starts with "chore: release v")
  # Or manually via workflow_dispatch with build-only option
  build:
    if: (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore:') && contains(github.event.head_commit.message, 'release v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.build-only == 'true')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: moon-release-linux-x86_64
          - os: macos-14  # Apple Silicon runner
            target: macos-arm64
            artifact: moon-release-macos-arm64
          - os: windows-latest
            target: windows-x86_64
            artifact: moon-release-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Patch moonbitlang/async for Windows (temporary fix)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon update
          # Find thread_pool.c in .mooncakes or registry
          $file = Get-ChildItem -Recurse -Filter "thread_pool.c" -Path ".mooncakes" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) {
            $file = Get-ChildItem -Recurse -Filter "thread_pool.c" -Path "$env:USERPROFILE/.moon/registry" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($file) {
            $content = Get-Content $file.FullName -Raw
            # Patch 1: startup_info.cb -> startup_info.StartupInfo.cb
            $content = $content -replace 'startup_info\.cb = sizeof\(STARTUPINFOEXW\);', 'startup_info.StartupInfo.cb = sizeof(STARTUPINFOEXW);'
            # Patch 2: Replace all 'attrs' with 'startup_info.lpAttributeList'
            $content = $content -replace 'free\(attrs\)', 'free(startup_info.lpAttributeList)'
            $content = $content -replace 'UpdateProcThreadAttributeList\(\s*attrs,', 'UpdateProcThreadAttribute(startup_info.lpAttributeList,'
            # Patch 3: UpdateProcThreadAttributeList -> UpdateProcThreadAttribute (remaining)
            $content = $content -replace 'UpdateProcThreadAttributeList\(', 'UpdateProcThreadAttribute('
            Set-Content $file.FullName $content -NoNewline
            Write-Host "Patched thread_pool.c: $($file.FullName)"
          } else {
            Write-Host "WARNING: thread_pool.c not found, skipping patch"
          }

      - name: Build
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            moon update
          fi
          moon build --target native
        shell: bash

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp ./target/native/release/build/src/main/main.exe ./${{ matrix.artifact }}
          chmod +x ./${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          copy .\target\native\release\build\src\main\main.exe .\${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Create release and attach binaries
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Build moon-release
        run: |
          moon update
          moon build --target native

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;
          ls -la release-assets/

      - name: Get version from moon.mod.json
        id: version
        run: |
          VERSION=$(grep '"version"' moon.mod.json | sed 's/.*: *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release with binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run moon-release to create tag and release
          ./target/native/release/build/src/main/main.exe release --verbose

          # Upload binaries to the release
          gh release upload "v${{ steps.version.outputs.version }}" release-assets/* --clobber
